<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BASEMAX</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #f5f7fa;

      font-family: Arial, Helvetica, sans-serif;

      color: #202124;

    }

    .container {

      width: 100%;

      max-width: 390px;

      padding: 20px;

    }

    .card {

      background: #fff;

      border-radius: 14px;

      padding: 34px 30px 28px;

      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);

    }

    .logo {

      text-align: center;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: 1px;

      margin-bottom: 28px;

    }

    h1 {

      text-align: center;

      font-size: 23px;

      margin: 0 0 8px;

    }

    .subtitle {

      text-align: center;

      color: #6b7280;

      font-size: 14px;

      margin-bottom: 28px;

    }

    label {

      display: block;

      font-size: 14px;

      font-weight: 600;

      margin-bottom: 7px;

    }

    input {

      width: 100%;

      height: 46px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      padding: 0 13px;

      font-size: 15px;

      outline: none;

      margin-bottom: 18px;

    }

    input:focus {

      border-color: #2563eb;

    }

    .password-box {

      position: relative;

    }

    .password-box input {

      padding-right: 75px;

    }

    .toggle {

      position: absolute;

      right: 12px;

      top: 13px;

      border: 0;

      background: none;

      color: #2563eb;

      cursor: pointer;

      font-size: 13px;

    }

    button.login {

      width: 100%;

      height: 46px;

      border: 0;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      margin-top: 4px;

    }

    button.login:hover {

      background: #1d4ed8;

    }

    .error {

      display: none;

      margin-top: 18px;

      padding: 13px;

      border-radius: 8px;

      background: #fff1f2;

      color: #be123c;

      font-size: 14px;

      line-height: 1.5;

      text-align: center;

    }

    .error.show {

      display: block;

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">BASEMAX</div>

      <h1>Iniciar sesión</h1>

      <div class="subtitle">

        Introduce tus datos para continuar

      </div>

      <form id="loginForm">

        <label for="username">Usuario</label>

        <input

          type="text"

          id="username"

          autocomplete="off"

          placeholder="Usuario"

        >

        <label for="password">Contraseña</label>

        <div class="password-box">

          <input

            type="password"

            id="password"

            autocomplete="off"

            placeholder="Contraseña"

          >

          <button

            type="button"

            class="toggle"

            id="togglePassword"

          >

            Mostrar

          </button>

        </div>

        <button class="login" type="submit">

          Iniciar sesión

        </button>

      </form>

      <div class="error" id="error">

        Acceso restringido por la red.<br>

        No se puede completar el inicio de sesión debido a las restricciones de red.

      </div>

    </div>

  </div>

  <script>

    const form = document.getElementById("loginForm");

    const error = document.getElementById("error");

    const password = document.getElementById("password");

    const toggle = document.getElementById("togglePassword");

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      error.classList.add("show");

    });

    toggle.addEventListener("click", function() {

      if (password.type === "password") {

        password.
            type = "text";

        toggle.textContent = "Ocultar";

      } else {

        password.type = "password";

        toggle.textContent = "Mostrar";

      }

    });

  </script>

</body>

</html>
